name: docker ok fixture
on: [push]
env:
  HELIX_PATCHES_FROM_CLEAN: "1"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Cross-compile in the toolchain container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/src \
            -e HELIX_PATCHES_FROM_CLEAN \
            -w /src \
            helixscreen/toolchain-k1 \
            make PLATFORM_TARGET=k1 HELIX_PACKAGING=1 -j$(nproc)
      - name: Show ccache stats
        run: |
          docker run --rm \
            -e CCACHE_DIR=/root/.cache/ccache \
            helixscreen/toolchain-k1 \
            ccache -s
