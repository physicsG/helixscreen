# Root config: read by Klipper from top to bottom, includes where they stand
[include hardware.cfg]

[printer]
kinematics: corexy
max_velocity: 300  # mm/s
max_accel: 3000
square_corner_velocity = 5.0

[probe]
samples: 3

[include conf.d/*.cfg]
[include missing.d/*.cfg]

[extruder]
rotation_distance: 22.6789511
nozzle_diameter: 0.400 ; inline semicolon comment

[gcode_macro START_PRINT]
gcode:
    G28
    # a comment line inside the macro
    G1 Z10 F600

[printer]
max_accel: 5000

