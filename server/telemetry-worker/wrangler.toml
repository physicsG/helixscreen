name = "helixscreen-telemetry"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[[r2_buckets]]
binding = "TELEMETRY_BUCKET"
bucket_name = "helixscreen-telemetry"
jurisdiction = "eu"

[[analytics_engine_datasets]]
binding = "TELEMETRY_ANALYTICS"
dataset = "helixscreen_telemetry"

[vars]
CLOUDFLARE_ACCOUNT_ID = "4f3ea9194c32f9ce44bc77916411315e"
# Zone whose HTTP analytics carry the update-manifest polls (helixscreen.org).
# Not a secret; the token that reads it is.
CDN_ZONE_ID = "1e67df337dfd51d36b3e057684ae90c8"
# Feedback loop settings. Its secrets are set with `wrangler secret put`:
# RESEND_API_KEY (weekly report and alert email) and GITHUB_APP_PRIVATE_KEY
# (filing issues). Without them the loop skips email or issues and says so.
GITHUB_REPO = "prestonbrown/helixscreen"
GITHUB_APP_ID = "2892859"
NOTIFICATION_EMAIL = "pbrown+helixscreen@brown-house.net"
EMAIL_FROM = "HelixScreen <noreply@helixscreen.org>"
DASHBOARD_URL = "https://helixscreen-analytics.pages.dev"

[[routes]]
pattern = "telemetry.helixscreen.org/*"
zone_name = "helixscreen.org"

# Daily CDN fleet snapshot. Zone analytics roll off after ~8 days, so this must
# run often enough to capture each day before it expires. 02:10 UTC snapshots
# the UTC day that just closed. 13:00 UTC runs the feedback loop (the daily alert
# check, plus the weekly report on Mondays).
[triggers]
crons = ["10 2 * * *", "0 13 * * *"]

# Rate limiting: 10 ingest requests per IP per 60 seconds
# Each request batches up to 20 events, so 200 events/min per IP is plenty
[[ratelimits]]
name = "INGEST_LIMITER"
namespace_id = "1001"
[ratelimits.simple]
limit = 10
period = 60
