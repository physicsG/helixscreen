name: Compile Android release native code for one ABI
description: |
  The native half of a signed Android release, for a single ABI: the same CMake
  arguments as release.yml's packaging would pass (helixDiagUploads stands in
  for the keystore that turns diagnostic uploads on), compiled and stripped,
  with no packaging or signing. Leaves the libraries under `lib-dir`/<abi>/.

  release.yml compiles with it and ccache-warm.yml warms with it. Sharing one
  invocation is what makes the warm cache hit: a flag that differs between the
  two changes every compile's hash and the release runs cold. Run it after
  actions/checkout and ./.github/actions/init-submodules.

inputs:
  abi:
    description: One Android ABI (arm64-v8a, armeabi-v7a, x86_64).
    required: true
  save-cache:
    description: Save the ccache at job end. Only main may save; see ccache-warm.yml.
    required: false
    default: "false"

outputs:
  lib-dir:
    description: Directory holding <abi>/*.so, ready for -PhelixPrebuiltJniLibs.
    value: android/app/build/intermediates/stripped_native_libs/release/stripReleaseDebugSymbols/out/lib

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Install Android NDK
      shell: bash
      run: |
        yes | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14206865" || true

    # One cache per ABI: the three share no objects, and a restore-keys prefix
    # resolves to the newest entry, so one shared key would hand each ABI
    # whichever ABI saved last. evict-old-files trims a saved cache to the
    # entries this compile used.
    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1.2.22
      with:
        key: release-android-${{ inputs.abi }}
        max-size: 1500M
        save: ${{ inputs.save-cache }}
        evict-old-files: ${{ inputs.save-cache == 'true' && 'job' || '' }}

    - name: Cache Gradle
      uses: actions/cache@v5
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-

    - name: Apply submodule patches
      shell: bash
      run: make apply-patches HELIX_PATCHES_FROM_CLEAN=1

    # stripReleaseDebugSymbols is the last native step before packaging, so the
    # packaging job's own strip is a no-op on these and the libraries ship
    # byte for byte as compiled here. Unstripped they are ~13x larger.
    - name: Compile and strip native code (${{ inputs.abi }})
      shell: bash
      working-directory: android
      run: ./gradlew stripReleaseDebugSymbols -PhelixAbis=${{ inputs.abi }} -PuseCcache -PhelixDiagUploads

    - name: Verify the ABI's libraries were produced
      shell: bash
      run: |
        set -euo pipefail
        dir="android/app/build/intermediates/stripped_native_libs/release/stripReleaseDebugSymbols/out/lib/${{ inputs.abi }}"
        if [ ! -f "$dir/libmain.so" ]; then
          echo "::error::$dir/libmain.so is missing: AGP moved its stripped-libs output, or the compile produced nothing"
          exit 1
        fi
        ls -l "$dir"
