name: Warm release ccache

# Why this exists
# ----------------
# The Release workflow triggers on tags (refs/tags/vX.Y.Z). GitHub Actions scopes
# every cache by git ref, and a tag run can only restore caches from its own tag
# scope (always empty — each tag is brand new) or the default branch's scope. Tag
# runs can never read each other's caches, so no release ever restored the
# previous release's ccache: every release cross-compile ran 100% cold (measured
# ~1% hit across all platforms in the v0.99.107 logs). The heavy DRM+GLES+thorvg
# targets (pi, pi32, x86) sit at 58-70 min because of it and creep toward the
# job timeout as the tree grows.
#
# This workflow runs on `main`, so the ccache it saves lands in the DEFAULT
# BRANCH scope — the one scope a release tag *can* restore from. The release job
# reads it restore-only (see release.yml "Restore ccache"). It compiles with the
# exact same toolchain image, mount, and make invocation as the release so the
# cached objects match.
#
# Only the three heavy platforms are warmed: they are the only ones near the
# timeout. The light platforms (~35-47 min) have ample headroom and are
# intentionally left to build cold.
#
# Three ccaches at ~1.7 GB each do NOT "stay comfortably inside" GitHub's 10 GB
# per-repo budget, which is what this comment used to claim. That figure counted
# only this workflow's own caches. Measured right after v0.99.111 the repo sat at
# 10.77 GB and was actively evicting: 8.6 GB of it was per-SHA PR-CI ccaches
# (three ubuntu generations, two macOS), and seven of the nine ccache-release-*
# caches had already been evicted. That is why the v0.99.111 pi build ran cold
# and hit the OOM. cache-prune.yml keeps only the newest generation of each
# per-SHA family, and runs as the `prune` job below so that warming on demand
# before a release frees the room it is about to need.
#
# depend_mode is intentionally NOT enabled. The global -DHELIX_VERSION define
# changes every release, which sinks ccache direct-mode hits; ccache's
# preprocessed fallback excludes -D from its hash, so unchanged TUs still hit —
# but only while preprocessed mode is available, which depend_mode would disable.

on:
  schedule:
    # 06:00 UTC daily — after the 04:00 nightly, so a warm cache is waiting for
    # any release cut during the day. Cadence, not freshness, is the tradeoff:
    # a release lands as many hits as the last warm run's tree shares with it.
    - cron: '0 6 * * *'
  workflow_dispatch:  # Warm on demand right before cutting a release.

# One warm run at a time; a newer push supersedes an in-flight one.
concurrency:
  group: ccache-warm
  cancel-in-progress: true

# Every patch is judged from clean here (see build.yml for why the flag is
# environment-wide rather than per-step).
env:
  HELIX_PATCHES_FROM_CLEAN: "1"

jobs:
  # Free the budget BEFORE the matrix below tries to save ~1.6 GB x 3. Without
  # this, a warm run started right before cutting a release can push the repo
  # over 10 GB and have GitHub evict, LRU, the very caches it just wrote.
  prune:
    name: Prune stale ccaches
    uses: ./.github/workflows/cache-prune.yml
    permissions:
      actions: write

  warm:
    name: Warm (${{ matrix.display_name }})
    needs: [prune]
    # always() so a transient cache-API failure in the prune job degrades the
    # warm to "runs without the extra headroom" rather than skipping it entirely.
    # Upstream only - forks neither release nor share this repo's cache budget.
    if: always() && github.repository == 'prestonbrown/helixscreen'
    runs-on: ubuntu-22.04
    # This job is the one that MUST tolerate a fully cold build, because a cold
    # build is the only kind it ever does: its whole purpose is to produce the
    # cache that makes later builds warm. 120 was copied from the release job,
    # where it sizes a warm build, and that made pi unwarmable — a cold pi-both
    # takes ~115-125 min, so the warm leg died every run, no ccache-release-pi
    # was ever saved, and the release then had to build pi cold too and hit its
    # own ceiling. Sizing this for the cold case is what breaks that loop.
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: pi
            display_name: "Raspberry Pi"
            build_target: pi-both
          - platform: pi32
            display_name: "Raspberry Pi 32-bit"
            build_target: pi32-both
          - platform: x86
            display_name: "x86_64 Debian"
            build_target: x86-both

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: false

    - name: Initialize submodules
      uses: ./.github/actions/init-submodules

    # Mirror the release job: the heavy cross-compiles write GCC assembler temp
    # files and ccache to a root partition the runner ships nearly full.
    - name: Free up disk space
      run: |
        df -h /
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
        df -h /

    # The pi-both link is what actually kills this job, not the compile: the
    # runner OOM-kills it (exit 137) about two minutes after helix-splash and
    # helix-watchdog link, which is the main helix-screen link — and pi-both
    # links that binary twice, once per display variant. It fit on v0.99.108 at
    # ~82 min and no longer does, so the peak has simply crept past the runner's
    # RAM. Parallelism is not the lever here: the spike is a single ld process,
    # so -j cannot shrink it. Swap lets the link page instead of dying; it costs
    # wall time only when the peak is actually exceeded. Sized well above the
    # observed overshoot because ld's peak grows with the tree.
    - name: Add swap for the link peak
      run: |
        free -h
        sudo fallocate -l 16G /swapfile-helix || sudo dd if=/dev/zero of=/swapfile-helix bs=1M count=16384
        sudo chmod 600 /swapfile-helix
        sudo mkswap /swapfile-helix
        sudo swapon /swapfile-helix
        free -h

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    # Save+restore (unlike the release, which is restore-only). The unique run_id
    # suffix guarantees a fresh save every run — a fixed key would hit on the
    # primary key and actions/cache would then skip the save, freezing the cache.
    # restore-keys still restores the most recent prior warm cache to build on.
    - name: Cache ccache
      uses: actions/cache@v5
      with:
        path: /tmp/.ccache-${{ matrix.platform }}
        key: ccache-release-${{ matrix.platform }}-${{ github.run_id }}
        restore-keys: |
          ccache-release-${{ matrix.platform }}-

    # CCACHE_DIR is passed on the docker runs below, and it is load-bearing:
    # ccache only reads <cache_dir>/ccache.conf when CCACHE_DIR is set
    # explicitly. With just the bind mount it looks for ~/.config/ccache/
    # ccache.conf, finds nothing, and silently keeps its 5 GB default - which is
    # what these caches actually grew to ("max cache size 5.0 GB" in this job's
    # own ccache -s output, against a 10 GB per-repo budget shared with CI).
    - name: Configure ccache
      run: |
        mkdir -p /tmp/.ccache-${{ matrix.platform }}
        printf 'max_size = 2G\ncompression = true\n' > /tmp/.ccache-${{ matrix.platform }}/ccache.conf

    - name: Build ${{ matrix.platform }} toolchain image
      # Same type=gha scope the release uses, so this also warms the toolchain
      # image cache (default-branch scope) that the release restores.
      run: |
        docker buildx build \
          --cache-from type=gha,scope=toolchain-${{ matrix.platform }} \
          --cache-to type=gha,mode=max,scope=toolchain-${{ matrix.platform }} \
          --load \
          -t helixscreen/toolchain-${{ matrix.platform }} \
          -f docker/Dockerfile.${{ matrix.platform }} \
          docker/

    # Identical to the release cross-compile step (same image, mount, make flags)
    # so the ccache objects this produces are the ones the release will look up.
    # No packaging, symbols, or image generation — the objects in ccache are the
    # entire product of this job.
    - name: Cross-compile for ${{ matrix.display_name }} (warm cache only)
      run: |
        docker run --rm \
          -v "${{ github.workspace }}":/src \
          -v /tmp/.ccache-${{ matrix.platform }}:/root/.cache/ccache \
          -e CCACHE_DIR=/root/.cache/ccache \
          -e HELIX_PATCHES_FROM_CLEAN \
          -w /src \
          helixscreen/toolchain-${{ matrix.platform }} \
          make PLATFORM_TARGET=${{ matrix.build_target }} HELIX_PACKAGING=1 SKIP_OPTIONAL_DEPS=1 -j$(nproc)

    - name: Show ccache stats
      run: |
        docker run --rm \
          -v /tmp/.ccache-${{ matrix.platform }}:/root/.cache/ccache \
          -e CCACHE_DIR=/root/.cache/ccache \
          helixscreen/toolchain-${{ matrix.platform }} \
          ccache -s

    # gpu-libs-hidden-smoke below runs the binary this leg built, so the check
    # the release waits on runs every night on main as well.
    - name: Upload x86 helix-screen for the GPU-libraries-hidden smoke
      if: matrix.platform == 'x86'
      uses: actions/upload-artifact@v7
      with:
        name: warm-x86-helix-screen
        path: build/x86/bin/helix-screen
        if-no-files-found: error
        retention-days: 3

  # release.yml's build-android-native, one leg per ABI through the same
  # composite action, so each ABI's cache holds exactly the objects that
  # release leg will look up. No packaging or signing.
  warm-android:
    name: Warm (Android ${{ matrix.abi }})
    needs: [prune]
    if: always() && github.repository == 'prestonbrown/helixscreen'
    runs-on: ubuntu-22.04
    # Sized for a cold ABI, the only kind this job is guaranteed to tolerate:
    # ~30 min, so 60 is twofold margin.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: false

    - name: Initialize submodules
      uses: ./.github/actions/init-submodules

    - name: Compile native code (release, warm cache only)
      uses: ./.github/actions/android-native-release
      with:
        abi: ${{ matrix.abi }}
        save-cache: "true"

  # release.yml's gpu-libs-hidden-smoke, on the nightly x86 build. A job of its
  # own rather than a step in the warm leg: a failed step there would also lose
  # that leg's ccache save. It runs from a checkout, which supplies the ui_xml/
  # and assets/ a release tarball would.
  gpu-libs-hidden-smoke:
    name: GPU libraries hidden (x86)
    needs: [warm]
    if: ${{ !cancelled() && github.repository == 'prestonbrown/helixscreen' }}
    runs-on: ubuntu-22.04
    # Two image-build attempts of up to 15 minutes each, then the runs.
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    # On a cache miss this pulls the base image and apt packages, so a network
    # flake would fail the smoke and red the nightly; one retry absorbs it.
    - name: Build x86 toolchain image
      uses: nick-fields/retry@v4
      with:
        timeout_minutes: 15
        max_attempts: 2
        retry_wait_seconds: 30
        command: |
          docker buildx build \
            --cache-from type=gha,scope=toolchain-x86 \
            --load \
            -t helixscreen/toolchain-x86 \
            -f docker/Dockerfile.x86 \
            docker/

    - name: Download x86 helix-screen
      uses: actions/download-artifact@v8
      with:
        name: warm-x86-helix-screen
        path: build/x86/bin

    - name: Run with the GPU libraries hidden and present
      run: |
        chmod +x build/x86/bin/helix-screen
        docker run --rm --network none \
          -v "${{ github.workspace }}":/src \
          -w /src \
          -e GPU_SMOKE_WORK=/tmp/gpu-libs-smoke \
          helixscreen/toolchain-x86 \
          scripts/ci/gpu_libs_hidden_smoke.sh run build/x86/bin/helix-screen

  # Drop the generation this run just superseded.
  #
  # actions/cache writes its cache in a post-step at job end, so no step inside
  # the matrix above can run after its own save -- the cleanup has to be a job
  # that needs it. Without this, the previous generation is left for GitHub's
  # LRU to reclaim, and LRU picks the wrong victim: the warm's restore-keys
  # lookup touches the old release caches at job start, refreshing their access
  # time, while the Ubuntu CI ccache has sat untouched since the last push to
  # main. So the repo goes over its 10 GB budget carrying ~4.7 GB of duplicate
  # release caches and evicts CI's ccache to pay for them. Measured 2026-08-26:
  # the ccache-ubuntu-22.04 entry present at 05:55 was gone by 10:14, and the
  # next two pushes compiled at 0.00% hits -- the second timed out.
  #
  # `needs` alone gates this on every matrix leg succeeding. A partial warm
  # leaves all three generations in place, which is the conservative outcome:
  # duplicates cost budget, a missing release ccache costs a release.
  prune-superseded:
    name: Drop the superseded release ccache
    needs: [warm, warm-android]
    uses: ./.github/workflows/cache-prune.yml
    with:
      include_release: true
    permissions:
      actions: write
