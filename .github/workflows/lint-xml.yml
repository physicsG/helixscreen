name: XML Lint

on:
  push:
    branches:
      - main
      - "claude/**"
      # Report branches carry a worker's STATUS.md over a full tree. Nothing
      # in them is code, and each push otherwise queues a whole build.
      - "!claude/report-*"
      - "release/**"
    paths:
      - 'ui_xml/**'
      - 'src/ui/**'
      - 'lib/helix-xml/**'
      - 'tools/xml-linter/**'
      - 'assets/config/themes/**'
      - 'mk/tools.mk'
      - '.github/workflows/lint-xml.yml'
  pull_request:
    branches: [ main, "release/**" ]
    paths:
      - 'ui_xml/**'
      - 'src/ui/**'
      - 'lib/helix-xml/**'
      - 'tools/xml-linter/**'
      - 'assets/config/themes/**'
      - 'mk/tools.mk'
      - '.github/workflows/lint-xml.yml'

# A push to a claude/** work branch is superseded within minutes on a busy day,
# and this workflow can hold a runner for hours. Keying the group on the ref
# lets a newer push cancel the older run there. main and release/** key on the
# SHA instead, so every commit that lands keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (startsWith(github.ref, 'refs/heads/release/') && github.sha || github.ref) }}
  cancel-in-progress: true

jobs:
  lint-xml:
    name: helix-xml-linter
    runs-on: ubuntu-22.04
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run helix-xml-linter (errors fail the build)
        run: make lint-xml
