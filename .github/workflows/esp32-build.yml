name: esp32-build
# ESP32 is not a supported target on the 1.0 release line.
on:
  pull_request:
    branches-ignore: ["release/1.0"]
  push:
    branches: [main, "release/**", "!release/1.0"]
  # release.yml calls this to ship the firmware. A non-empty release_tag adds a
  # packaging step and uploads the zip as release-esp32-ktouch, which the
  # release and upload-r2 jobs pick up with every other release-* artifact.
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ""

# A ~25 min job. Superseded pushes to the same PR/branch are cancelled rather
# than queued behind each other; main is keyed per-SHA so pushes there still
# each get a build.
concurrency:
  group: esp32-build-${{ github.workflow }}-${{ github.event.pull_request.number || (startsWith(github.ref, 'refs/heads/release/') && github.sha || github.ref) }}
  # main does not cancel: at ~28 minutes a run is superseded before it finishes
  # on a busy day, so cancelling leaves main with no firmware result at all
  # rather than a slightly stale one. Queued runs still collapse to the newest.
  # fromJSON, or the expression yields the truthy string "false" and main
  # cancels anyway.
  cancel-in-progress: ${{ fromJSON(github.ref != 'refs/heads/main') }}

# Every patch is judged from clean here (see build.yml for why the flag is
# environment-wide rather than per-step).
env:
  HELIX_PATCHES_FROM_CLEAN: "1"
  # Read by the build and packaging steps. The comment on esp_idf_version below
  # says why it is pinned.
  ESP_IDF_VERSION: v5.5.5

jobs:
  build:
    runs-on: ubuntu-latest
    # The build itself runs ~25 min; the ceiling is for a hung idf.py/docker
    # pull, which would otherwise hold a runner for the 6h default.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Apply submodule patches
        run: make apply-patches
      - name: Build firmware
        # Pinned to a commit, not the rolling @v1 major tag: @v1 moves, and this
        # action's whole job is choosing and running a toolchain container, so a
        # silent update to it is a silent toolchain change. This SHA is what @v1
        # resolved to on 2026-08-11 (one commit past the v1.2.0 release), so the
        # pin is a no-op today and stops the drift from here on.
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d
        with:
          # v5.5.4 emits C++ exception unwind tables roughly five times larger
          # than every neighbouring release, and that alone is why this job has
          # been red. Measured on one tree with one sdkconfig and one compiler
          # (xtensa-esp-elf 14.2.0, byte-identical between the two containers),
          # varying only the IDF container:
          #
          #   idf:v5.5.4   .bin 8,339,984   .eh_frame 2,080,192   overflows ota_0
          #   idf:v5.5.5   .bin 6,685,696   .eh_frame   416,508   fits, 2% free
          #
          # The +1,663,688 B of .eh_frame is the entire overflow to within 12 KB.
          # The app itself grew ~44 KB across the 43 commits in that window, so
          # the "flash bloat" this job reported was never the firmware. Note the
          # local dev toolchain has been on a good v5.5 build all along, which is
          # why it fit locally and failed here for weeks with nobody able to see
          # the difference. Keep both pinned, and re-measure before moving
          # ESP_IDF_VERSION.
          esp_idf_version: ${{ env.ESP_IDF_VERSION }}
          target: esp32s3
          path: firmware/helixscreen-esp32
          # storage_frogfs.bin is a BUILD INPUT, not output: main/CMakeLists.txt
          # FATAL_ERRORs if it is missing. But the packer needs jkent/frogfs's
          # mkfrogfs.py, which the ESP-IDF component manager fetches during the
          # first `idf.py reconfigure`. So: reconfigure once (expected to fail on
          # the missing-image guard, AFTER populating managed_components/), stage
          # + pack the frogfs image, then build for real. Runs inside the action's
          # container (cwd = path).
          command: |
            set -e
            idf.py reconfigure || true
            test -f managed_components/jkent__frogfs/tools/mkfrogfs.py
            python3 -m venv /tmp/esp32imgs-venv
            /tmp/esp32imgs-venv/bin/pip install --quiet Pillow
            /tmp/esp32imgs-venv/bin/python ../../scripts/esp32_printer_images.py
            python3 ../../scripts/esp32_stage_assets.py
            python3 -m venv /tmp/esp32pack-venv
            /tmp/esp32pack-venv/bin/pip install --quiet pyyaml
            /tmp/esp32pack-venv/bin/python ../../scripts/esp32_pack_assets.py
            idf.py build
      # The packer round-trip (tests/python/test_esp32_pack_assets.py) drives the
      # real mkfrogfs.py out of managed_components/jkent__frogfs, which only
      # exists because the reconfigure above vendored it. No other CI job has
      # ESP-IDF, so this is the only place those assertions can actually run --
      # the nightly Python job can only ever skip them. HELIX_FROGFS_REQUIRED
      # turns the module's skip gate into a hard failure so a component that
      # stops being vendored is loud here instead of green everywhere.
      - name: Packed-asset round-trip tests
        env:
          HELIX_FROGFS_REQUIRED: "1"
        run: |
          # A venv, not --user: the runner image's Python is PEP 668
          # externally-managed, so a bare `pip install --user` errors out. Same
          # shape the packing step above already uses inside the container.
          python3 -m venv /tmp/frogfs-test-venv
          /tmp/frogfs-test-venv/bin/pip install --quiet pytest pyyaml
          /tmp/frogfs-test-venv/bin/python -m pytest tests/python/test_esp32_pack_assets.py -v --tb=short

      - name: Size budget gate
        # The map argument also fails the job if the link pulled libstdc++'s
        # std::locale machinery back in, naming the object that did.
        run: |
          python3 scripts/check_esp32_size.py \
            firmware/helixscreen-esp32/build/helixscreen_esp32.bin \
            firmware/helixscreen-esp32/size_budget.json \
            firmware/helixscreen-esp32/build/helixscreen_esp32.map

      - name: Package release firmware
        if: inputs.release_tag != ''
        # Same image the build step ran in, so the merge uses the esptool that
        # ships with this IDF (the action leaves it pulled). Its entrypoint
        # activates the IDF environment.
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          docker run --rm -e RELEASE_TAG -v "$PWD:/w" -w /w "espressif/idf:$ESP_IDF_VERSION" \
            bash -c 'scripts/esp32_package_release.sh "$RELEASE_TAG"'

      - name: Upload release firmware
        if: inputs.release_tag != ''
        uses: actions/upload-artifact@v7
        with:
          name: release-esp32-ktouch
          path: releases/helixscreen-esp32-ktouch-*.zip
          if-no-files-found: error
          retention-days: 7
